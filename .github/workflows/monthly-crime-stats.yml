# Runs on the 10th of every month at 10:00 Bangladesh time (04:00 UTC), downloads the newest police statistics PDF
# and replaces stats/latest. Set these in the GitHub repository settings:
#   secrets:   AID_API_KEY, AID_DB_URL, AID_EMAIL, AID_PASSWORD   (the control center login)
#   variables: CRIME_COLUMNS   (the PDF's numeric columns in order, e.g. "Murder,Robbery,Theft")
name: monthly-crime-stats
on:
  schedule:
    - cron: "0 4 10 * *"
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: mvn -q -f backend/pom.xml package -DskipTests
      - name: Download newest PDF and publish
        env:
          AID_API_KEY: ${{ secrets.AID_API_KEY }}
          AID_DB_URL: ${{ secrets.AID_DB_URL }}
          AID_EMAIL: ${{ secrets.AID_EMAIL }}
          AID_PASSWORD: ${{ secrets.AID_PASSWORD }}
        run: |
          java -jar backend/target/aidalert-ingest-1.0.jar \
            --page https://www.police.gov.bd/en/january_2020 --period auto \
            --columns "${{ vars.CRIME_COLUMNS }}" \
            --source-url https://www.police.gov.bd/en/january_2020
